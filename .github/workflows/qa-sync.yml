name: Sync main <> QA

on:
  pull_request:
    types: [closed]
    branches:
      - main
  issue_comment:
    types: [created, edited]

jobs:
  post-checkbox:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref != 'qa'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post sync checkbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf '%s\n' \
            "## Sincronização de branches" \
            "" \
            "Essa pull request foi mergeada diretamente na branch \`main\`, portanto a branch \`qa\` ficará desatualizada caso ela não seja sincronizada. Marque a caixa abaixo para sincronizar automaticamente a branch \`qa\`." \
            "" \
            "- [ ] **Sincronizar automaticamente a branch \`qa\`**" \
            "" \
            "<!-- qa-sync-source-command -->")

          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "$body"

  sync:
    if: github.event_name == 'issue_comment' && github.event.action == 'edited' && github.event.issue.pull_request && contains(github.event.comment.body, '- [x] **Sincronizar automaticamente a branch `qa`**')
    permissions:
      contents: write
      pull-requests: write
    uses: Solierrr/.github/.github/workflows/qa-sync.yml@main
    with:
      source-pr-number: ${{ github.event.issue.number }}
